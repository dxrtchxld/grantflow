<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>GrantFlow</title>
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        min-height: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1A1A2E;
      }
      /* Allow natural vertical scrolling across browsers and devices */
      html {
        overflow-x: hidden;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      body {
        overflow-x: hidden;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100%;
        height: 100%;
        flex: 1;
      }
      /* Prevent horizontal carousels from blocking vertical page scroll */
      div[style*="flex-direction: row"] {
        touch-action: pan-x pan-y;
      }
      /* Ensure scroll containers have smooth inertia scrolling and bounds */
      div[style*="overflow-y: auto"],
      div[style*="overflow-y: scroll"] {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }
    </style>
    <link rel="icon" href="/favicon.ico"/>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
